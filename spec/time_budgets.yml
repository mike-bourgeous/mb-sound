# Time budgets for rake spec:parallel (spec/parallel_specs.rb,
# #check_budgets; test-speed-2, 2026-10-18).  Times are as measured in the
# parallel run (the runner's PARALLEL=12 on a 16-core machine): a file's
# examples together, and each example.  A file or example over its budget
# fails the run; make it faster (see CLAUDE.md, Testing: condition waits
# instead of quiet periods, short renders, one-sample buffers only over
# what they prove, SpecBuffers.join) or give its file an entry here with
# the time it needs and why (MB_SOUND_SPEC_BUDGET=report only lists them,
# for a loaded machine).
#
# Budgets are in the reference machine's seconds.  Each machine scales them
# by its own speed (omnibus11, 2026-10-22; maintainer: "Set them relative
# to each machine's performance on first run maybe?  Sounds like they're
# too strict to begin with."): on its first spec:parallel run at a given
# PARALLEL, spec/host_speed_bench.rb runs in that many processes at once,
# its median time goes to tmp/spec_host_speed.json (per CPU and PARALLEL;
# MB_SOUND_SPEC_CALIBRATE=1 measures again), and budgets multiply by that
# time over reference.seconds (never by less than 1).  The defaults were
# loosened from 15 and 6 s at the same time.
reference:
  machine: AMD Ryzen 9 7950X (the Linux runner), PARALLEL=12
  # An estimate until the runner measures its own (its first run prints
  # "host speed ... s"): the Mac i9's 0.491 s at PARALLEL=2 over the
  # suites' ratio, 1223.8 s of examples there against the runner's
  # 608.9 s (ui-api-1-2), 2.01
  seconds: 0.244
default:
  file: 20
  example: 8
files:
  spec/lib/mb/sound/ui/inspect_audible_spec.rb:
    example: 12
    reason: the slow tier renders a bar of the instrument once per turnable param to prove each turn is heard or marked (the init voice has the most params); 22.4 s for the init case in the 2026-11-02 batch suite at PARALLEL=8 under load, x2.34 = 9.6 reference seconds (inspector-nav-1)
  spec/bin/play_spec.rb:
    file: 35
    example: 12
    reason: six real bin/play.rb processes in ptys (the player screens need real terminals and the real startup; each spends 3-5 s on startup and YJIT/UI warm-up, a module 2 s more on its form warm-up), the module screen example stepping through every key; 44.5 s alone in the Mac container (12.7 s for that example), 84.6 s at PARALLEL=8 under load at x2.68 = 31.6 reference seconds before its modules were shortened (play-ui-1, 2026-11-02)
  spec/bin/gc_soak_spec.rb:
    file: 80
    example: 70
    reason: the slow tier's GC-off soak plays tunnel_vision live for 75 s of audio at 1.5x real time (paced by the clock, about 50 s on any machine) after its warm-up (59 s in the Mac container, 2026-10-28; dropouts-2)
  spec/bin/ui_demo_spec.rb:
    file: 20
    example: 10
    reason: one real process playing bin/ui_demo.rb's song for 2.5 s after its form warm-up (about 7-10 s in the Mac container since alloc-2's per-track warm-up exercise, 2026-10-25), with the band drawn and measured; 18.99 s at PARALLEL=8 under load against the default 8 x2.33 = 18.6
  spec/lib/mb/sound/session_fuzz_spec.rb:
    file: 40
    example: 18
    reason: the random-songs example checks every relation (buffer sizes, plans, timeline parts, warm-ups, carries and spills since carry-1, fx swaps since library-2, equal lengths since session-2) for 3 seeds, one drawn from RSpec's seed, so its time varies by seed; about 16 s alone in the Mac container and 31.8-41 s at PARALLEL=8 under load (x2.4-2.8 = 11.4-14.7 reference seconds, 2026-10-31), over the default 8; 37.7 s at PARALLEL=8 after wire-1 added a wire command (2026-11-01; a new command changes which song each seed draws), so example 18
  spec/lib/mb/sound/session/carry_sweep_spec.rb:
    file: 52
    reason: the slow tier rebuilds each of the 41 shipped instrument presets mid-note with its state carried and compares 154 buffers against no rebuild (two renders each); 74.8 s at x2.29 = 32.7 reference seconds in the Mac container's spec:full at PARALLEL=8, 2026-10-29 (sound-design-2); 89.4 and 91.7 s in the 2026-10-31 and 2026-11-01 batch runs, 45.4 reference seconds at the idle calibration x2.02 (fix-batch-1101; a preset's build is about 0.2 s, its two 160000-frame renders the rest); the everyday run keeps 4 presets
  spec/lib/mb/sound/buffer_size_invariance_spec.rb:
    file: 50
    example: 15
    reason: one-sample-buffer renders of Synths to their end (about 70 us per buffer); runner 31 s, 7 s for the longest example (the Mac i9 at PARALLEL=2 19.6 s, 9.8 reference seconds); 2026-10-25 post-merge spec:full on the Mac at PARALLEL=8 under load 4.4 took 105.35 s = 45.2 reference seconds, over the old 45; 2026-10-26 the slow-tier example :196 (a Synth ending) took 31.66 s at x2.26 = 14 reference seconds in a post-merge spec:full, over the old example budget 12, and the same before and after render-rebuild-1 in alternating runs
  spec/lib/mb/sound/buffer_size_invariance_synth_spec.rb:
    file: 48
    example: 10
    reason: lane allocation and sampler chops at one-sample buffers (1.1 s each, 52800 buffers per pass); runner 25 s; the slow tier's spec:full at PARALLEL=8 in the Mac container took 66.0-91.7 s over the 2026-10-30 to 2026-11-01 batches (up to 45.4 reference seconds at the idle calibration x2.02), its two lane-allocation examples 14.9 and 15.9 s (7.9 reference seconds, fix-batch-1101)
  spec/lib/mb/sound/help_spec.rb:
    file: 33
    reason: every help example played and measured (13 s locally at PARALLEL=4 after test-speed-3's short drum file), every page checked for walls of text (4.4 s), and each lesson's steps checked before and after their code (3.2 s for :design); 47.0-52.0 s in the Mac container's spec:full at PARALLEL=8 over the 2026-10-30 to 2026-11-01 batches, 25.7 reference seconds at the idle calibration x2.02 (fix-batch-1101); lesson-gen-1 added lesson :generative (9 steps, 3.3 s, each step's bar measured like the others) and its lesson-shelf example (1.6 s), 59 s in one loaded process
  spec/lib/mb/sound/ui/tiles_spec.rb:
    file: 25
    reason: many real Tiles screens with a Pry REPL on a pty, each started and waited for; runner 18 s
  spec/lib/mb/sound/take_spec.rb:
    file: 25
    reason: live performances of 960 buffers replayed at several buffer sizes; runner 16.5 s
  spec/bin/songs/night_bus_capture_spec.rb:
    example: 12
    reason: renders 15 bars of the night bus jam with captures and learn (8.5 s on the runner)
  spec/lib/mb/sound/kernels_check_spec.rb:
    file: 35
    reason: every graph sweep factory (about 130) and scene planned and unplanned with each C kernel run beside its Ruby mirror, whose per-sample Ruby is the time; the slow tier adds 7-sample and 800-sample buffers through the mirrors; 68-83 s in the Mac container's spec:full at PARALLEL=8 over the 2026-10-30 to 2026-11-01 batches (no entry until then, so over the default every time); fix-batch-1101 cut it from 24.6 to 14.8 s alone everyday and 59.8 to 47.4 s with the slow tier (the coverage example reuses what the sweep examples reached; NoiseColor caches its impulse energy)
  spec/lib/mb/sound/arrangement/track_knobs_spec.rb:
    file: 32
    reason: the slow tier plays every shipped instrument preset (41) and genre patch twice, with its params as numbers and as track knobs, building each patch twice per run (about 0.2 s a build for an SQ-80 or FM preset); 47.7-57.8 s in the Mac container's spec:full at PARALLEL=8 in the 2026-10-31 and 2026-11-01 batches since library-2's preset and genre knobs, up to 28.6 reference seconds at the idle calibration x2.02 (fix-batch-1101); the everyday run keeps 5
  spec/bin/songs/generative_steer_spec.rb:
    example: 10
    reason: the density gesture needs the piece's 9-bar intro rendered (4.6 s alone, 6.2 s to FLAC) plus 5 bars without steering; 15.2-17.3 s at PARALLEL=8 in the Mac container over the 2026-10-30 to 2026-11-01 batches, up to 8.6 reference seconds at the idle calibration x2.02 (fix-batch-1101)
  spec/bin/preset_bench_spec.rb:
    example: 12
    reason: the slow tier's --vs example runs bin/preset_bench.rb as a real process, which renders the preset in this checkout and again through a child process in the other (two Ruby starts and two renders); 18.9-22.0 s at PARALLEL=8 in the Mac container's spec:full in the 2026-10-31 and 2026-11-01 batches, up to 10.9 reference seconds at the idle calibration x2.02 (fix-batch-1101)
